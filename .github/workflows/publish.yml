# Publish nano-mcp to PyPI with no API token (trusted publishing / OIDC).
#
# Why this file exists: the PyPI upload was the one step gated on an API token that
# only the customer can mint. PyPI supports a *pending* trusted publisher, which
# creates the project on first use and needs no token:
#   1. the customer adds a pending publisher at https://pypi.org/manage/account/publishing/
#        PyPI project name: nano-mcp
#        Owner:             PANDeveloper001
#        Repository name:   nano-mcp-public
#        Workflow name:     publish.yml
#        Environment name:  pypi
#   2. publishing a GitHub Release then uploads the sdist + wheel through GitHub's
#      OIDC identity, so no secret is stored in this repository.
# The name `nano-mcp` is still free (pypi.org/pypi/nano-mcp/json answers 404), but a
# pending publisher does not reserve it: if someone registers the name first, the
# publisher is invalidated. See the offer in openai-agents-nano-x402/.ledger/funnel.md.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel (holds no publishing credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Fail if the build produced nothing
        run: test -n "$(ls dist/*.whl dist/*.tar.gz 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI (OIDC, no token)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nano-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish (trusted publishing)
        run: uv publish --trusted-publishing always
